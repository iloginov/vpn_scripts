# Гайд: «Настраиваем SSH и ставим Fail2ban»
---
- name: apt cache valid
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: install fail2ban and nftables
  ansible.builtin.apt:
    name:
      - fail2ban
      - nftables
    state: present

- name: fail2ban ssh jail
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/fail2ban-ssh.conf.j2"
    dest: /etc/fail2ban/jail.d/ssh.conf
    mode: "0644"
  notify: restart fail2ban

- name: enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: sshd hardening drop-in
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/sshd-vpn.conf.j2"
    dest: /etc/ssh/sshd_config.d/99-vpn-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
