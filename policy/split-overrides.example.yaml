# Правки списка российских сетей. Лежит рядом с entry.yaml; нет файла — country ru без правок.
# vpn-admin пишет этот файл сам (клавиша s на экране «Настройка» entry), руками можно так же.
schema: 2
base:
  type: country        # country (делегирование RIR) или geo (регистрационные данные)
  code: ru             # две строчные латинские буквы
include:               # принудительно в российский канал: AS или IPv4 CIDR
  - AS64500
  - 203.0.113.0/24
exclude:               # принудительно мимо него; исключения сильнее добавлений
  - AS64501
  - 198.51.100.0/24
