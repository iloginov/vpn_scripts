# Entry с выходом российских сетей через второй сервер.
# Список сетей: fetch качает базу и AS из split-overrides.yaml рядом с этим файлом
# (нет файла — country ru), render собирает файлы из кеша без сети. nft сам не запускает.
schema: 2

client:
  iface: awg0
  subnet: 10.10.2.0/24
  listen_port: 443

# Основной канал: всё, что не помечено.
uplink:
  iface: awg1
  table: clientroute
  table_id: 100

rules:
  to_client_priority: 1000
  iif_priority: 2000
  from_priority: 2010

# Выход по fwmark. Убери всю секцию — получится файрвол без сплита.
ru_exit:
  iface: awg2
  table: ruroute
  table_id: 101
  fwmark: 0x100
  priority: 1100
  rules_path: /etc/awg-ru-split/rules.nft
